version: 0.2

phases:
  install:
    commands:
      # Create required directories and files
      - mkdir -p $HOME/.nvm
      - touch $HOME/.bashrc
      # Install nvm
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
      # Add nvm to bashrc
      - echo 'export NVM_DIR="$HOME/.nvm"' >> $HOME/.bashrc
      - echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> $HOME/.bashrc
      - echo '[ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"' >> $HOME/.bashrc
      # Load nvm
      - export NVM_DIR="$HOME/.nvm"
      - . $NVM_DIR/nvm.sh
      - . $NVM_DIR/bash_completion
      # Install and use Node.js
      - nvm install 18
      - nvm use 18
      - node --version
      - npm --version
      # Install pnpm
      - npm install -g pnpm@latest
      # Set NODE_OPTIONS for more memory during build
      - export NODE_OPTIONS="--max-old-space-size=8192"
      # Install dependencies with frozen lockfile disabled
      - pnpm install --no-frozen-lockfile

  build:
    commands:
      # Run the build command using pnpm
      - NODE_OPTIONS=--max-old-space-size=8192 pnpm run build
      # Invalidate CloudFront cache after building
      - aws cloudfront create-invalidation --distribution-id E1J0UER6Y04W2A --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: out
