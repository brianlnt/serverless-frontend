version: 0.2

phases:
  install:
    commands:
      # Install Node.js using n
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
      - export NVM_DIR="$HOME/.nvm"
      - test -s "$NVM_DIR/nvm.sh" && . "$NVM_DIR/nvm.sh"
      - nvm install 18
      - nvm use 18
      # Install pnpm
      - npm install -g pnpm@latest
      # Set NODE_OPTIONS for more memory during build
      - export NODE_OPTIONS="--max-old-space-size=8192"
      # Install dependencies with frozen lockfile disabled
      - pnpm install --no-frozen-lockfile

  build:
    commands:
      # Run the build command using pnpm
      - pnpm run build
      # Invalidate CloudFront cache after building
      - aws cloudfront create-invalidation --distribution-id E1J0UER6Y04W2A --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: out
