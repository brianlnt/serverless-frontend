version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      # Add runtime platform specification
      runtime-platform:
        os: amazon-linux-2
    commands:
      # Use npm's n package to ensure correct Node.js version
      - npm install -g n
      - n 18.17.0
      - npm install -g pnpm@latest
      # Install dependencies with pnpm
      - pnpm install
  build:
    commands:
      # Run the build command using pnpm
      - pnpm run build
      # Invalidate CloudFront cache after building
      - aws cloudfront create-invalidation --distribution-id E1J0UER6Y04W2A --paths "/*"
artifacts:
  files:
    - '**/*'
  base-directory: out