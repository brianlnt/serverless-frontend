version: 0.2

phases:
  pre_build:
    commands:
      # Install required system dependencies
      - yum update -y
      - yum install -y glibc glibc-devel
  install:
    runtime-versions:
      nodejs: 18
    commands:
      # Install pnpm globally
      - npm install -g pnpm
      # Install dependencies with pnpm
      - pnpm install
  build:
    commands:
      # Run the build command using pnpm
      - pnpm run build
      # Invalidate CloudFront cache after building
      - aws cloudfront create-invalidation --distribution-id E1J0UER6Y04W2A --paths "/*"
artifacts:
  files:
    - '**/*'
  base-directory: out  # Directory with output files (e.g., React app)